name: Refresh live data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub, GitLab, Letterboxd, OpenF1, App Store, RevenueCat and X data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVENUECAT_ECHO_KEY: ${{ secrets.REVENUECAT_ECHO_KEY }}
          REVENUECAT_DOCMARA_KEY: ${{ secrets.REVENUECAT_DOCMARA_KEY }}
          # optional read-only tokens that can see Mara's private repos; unset, the Mara counts keep their last value
          WORK_GITHUB_TOKEN: ${{ secrets.WORK_GITHUB_TOKEN }}
          WORK_GITLAB_TOKEN: ${{ secrets.WORK_GITLAB_TOKEN }}
          # optional official X API key; unset, posts come from X's free embed timeline
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node tools/refresh-data.mjs
      - name: Redraw the link preview
        run: node tools/og.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/data index.html assets/og.png && [ -z "$(git ls-files --others --exclude-standard -- assets/data/f1lap.json)" ] && [ -z "$(git status --porcelain -- assets/img/x)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data index.html assets/og.png
          if [ -f assets/data/f1lap.json ]; then git add -- assets/data/f1lap.json; fi
          if [ -d assets/img/x ]; then git add -A assets/img/x; fi
          git commit -m "Refresh live data"
          git push
