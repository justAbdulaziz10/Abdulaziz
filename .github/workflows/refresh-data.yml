name: Refresh live data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub, Letterboxd, F1 and App Store numbers
        env:
          GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
        run: node tools/refresh-data.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet -- assets/data && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "Refresh live data"
          git push
