name: Refresh live data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GitHub, Letterboxd, F1, App Store and RevenueCat numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVENUECAT_ECHO_KEY: ${{ secrets.REVENUECAT_ECHO_KEY }}
          REVENUECAT_DOCMARA_KEY: ${{ secrets.REVENUECAT_DOCMARA_KEY }}
        run: node tools/refresh-data.mjs
      - name: Redraw the link preview
        run: node tools/og.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet -- assets/data index.html assets/og.png && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data index.html assets/og.png
          git commit -m "Refresh live data"
          git push
