name: Refresh posts on X

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch the latest posts on X and recent pushes
        env:
          # official API key (paid per post read); unset, the job falls back to X's free embed timeline
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # hourly runs only ask for posts newer than the last one; the daily job refreshes the counts
          X_ONLY_NEW: "1"
          # read-only token for the public events call behind the push heartbeat (`pulse`)
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/refresh-data.mjs x pulse
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/data index.html && [ -z "$(git status --porcelain -- assets/img/x)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data index.html
          git add -A assets/img/x
          git commit -m "Refresh posts on X"
          git pull --rebase
          git push
