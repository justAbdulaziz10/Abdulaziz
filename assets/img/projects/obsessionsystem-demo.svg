<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="t d">
<title id="t">agent-ship blocks a skipped test</title>
<desc id="d">Real terminal output. A commit skips a failing test; agent-ship ci fails the floor guard and agent-ship push refuses. After a Floor-Guard-Ack line with a reason is added to the commit message, ci passes and the push goes through.</desc>
<rect width="960" height="580" rx="8" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="959" height="579" rx="8" fill="none" stroke="#30363d"/>
<circle cx="20" cy="18" r="5" fill="#30363d"/><circle cx="38" cy="18" r="5" fill="#30363d"/><circle cx="56" cy="18" r="5" fill="#30363d"/>
<line x1="0" y1="36" x2="960" y2="36" stroke="#21262d"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="24" y="58"><tspan fill="#7d8590">$&#160;</tspan><tspan fill="#e6edf3">agent-ship&#160;ci</tspan></text>
<text x="24" y="79"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">secret&#160;scan&#160;(HEAD&#160;--not&#160;--remotes=origin)</tspan></text>
<text x="24" y="100"><tspan fill="#f85149">FAIL&#160;</tspan><tspan fill="#c9d1d9">floor&#160;guard&#160;(HEAD&#160;--not&#160;--remotes=origin&#160;vs&#160;85ec5c3e7)</tspan></text>
<text x="24" y="121"><tspan fill="#f85149">&#160;&#160;-&#160;[skip-test]&#160;test_calc.py:6:&#160;@unittest.skip("flaky")</tspan></text>
<text x="24" y="142"><tspan fill="#7d8590">&#160;&#160;-&#160;deliberate?&#160;add&#160;to&#160;the&#160;commit&#160;message:&#160;Floor-Guard-Ack:&#160;&lt;rule&gt;[@&lt;path-glob&gt;]&#160;&lt;reason&gt;&#160;&#160;(`agent-ship&#160;ci&#160;--help`)</tspan></text>
<text x="24" y="163"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">whitespace/conflict&#160;markers</tspan></text>
<text x="24" y="184"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">python3&#160;-m&#160;unittest&#160;(0.0s)</tspan></text>
<text x="24" y="205"><tspan fill="#f85149">local&#160;CI&#160;FAILED&#160;for&#160;ef100531b</tspan></text>
<text x="24" y="247"><tspan fill="#7d8590">$&#160;</tspan><tspan fill="#e6edf3">agent-ship&#160;push</tspan></text>
<text x="24" y="268"><tspan fill="#f85149">STOP:&#160;no&#160;passing&#160;local&#160;CI&#160;for&#160;this&#160;commit;&#160;run&#160;`agent-ship&#160;ci`&#160;first&#160;(or&#160;--no-ci&#160;REASON)</tspan></text>
<text x="24" y="310"><tspan fill="#7d8590">$&#160;</tspan><tspan fill="#e6edf3">git&#160;commit&#160;--amend&#160;-m&#160;"make&#160;CI&#160;green"&#160;\</tspan></text>
<text x="24" y="331"><tspan fill="#e6edf3">&#160;&#160;&#160;&#160;-m&#160;"Floor-Guard-Ack:&#160;skip-test@test_calc.py&#160;upstream&#160;outage,&#160;tracked&#160;in&#160;#42"</tspan></text>
<text x="24" y="352"><tspan fill="#7d8590">$&#160;</tspan><tspan fill="#e6edf3">agent-ship&#160;ci</tspan></text>
<text x="24" y="373"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">secret&#160;scan&#160;(HEAD&#160;--not&#160;--remotes=origin)</tspan></text>
<text x="24" y="394"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">floor&#160;guard&#160;(HEAD&#160;--not&#160;--remotes=origin&#160;vs&#160;85ec5c3e7)</tspan></text>
<text x="24" y="415"><tspan fill="#7d8590">&#160;&#160;-&#160;[skip-test]&#160;test_calc.py:6:&#160;@unittest.skip("flaky")&#160;&#160;acked&#160;(upstream&#160;outage,&#160;tracked&#160;in&#160;#42)</tspan></text>
<text x="24" y="436"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">whitespace/conflict&#160;markers</tspan></text>
<text x="24" y="457"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">python3&#160;-m&#160;unittest&#160;(0.0s)</tspan></text>
<text x="24" y="478"><tspan fill="#3fb950">local&#160;CI&#160;PASSED&#160;for&#160;5fc93a876</tspan></text>
<text x="24" y="520"><tspan fill="#7d8590">$&#160;</tspan><tspan fill="#e6edf3">agent-ship&#160;push</tspan></text>
<text x="24" y="541"><tspan fill="#3fb950">ok&#160;&#160;&#160;</tspan><tspan fill="#c9d1d9">origin/fix-rounding&#160;=&#160;5fc93a876&#160;(canonical)</tspan></text>
</g></svg>
